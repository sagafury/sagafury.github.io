<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phone Agent Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <div class="logo">
                <img src="assets/logo.png" alt="Logo" id="logo">
            </div>
            <nav>
                <button class="nav-btn"><i class="fas fa-home"></i> Home</button>
                <button class="nav-btn"><i class="fas fa-cog"></i> Settings</button>
                <button class="nav-btn"><i class="fas fa-headset"></i> Service</button>
                <button class="nav-btn"><i class="fas fa-chart-bar"></i> Analytics</button>
            </nav>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Events Panel -->
            <div class="events-panel">
                <h2>Contact Events</h2>
                <button id="addEventBtn" class="primary-btn">
                    <i class="fas fa-plus"></i> Add Event
                </button>
                <div id="eventsList">
                    <!-- Events will be added here dynamically -->
                </div>
                <button id="startButton" class="start-btn" disabled>
                    Start Campaign
                </button>
            </div>

            <!-- Phone Screen Simulation -->
            <div class="phone-container">
                <div class="phone-frame">
                    <div class="phone-screen">
                        <!-- Phone content will be shown here when started -->
                        <div class="screen-content">
                            <p>Campaign not started</p>
                        </div>
                    </div>
                </div>
                
                <!-- Add this conversation log panel -->
                <div class="conversation-log">
                    <div class="log-header">
                        <span>Conversation Log</span>
                        <div class="status-indicator">
                            <span id="statusText">Idle</span>
                            <div id="statusLight"></div>
                        </div>
                    </div>
                    <div id="logContent"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Contact</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="mobile">Mobile Number:</label>
                    <input type="tel" id="mobile" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="language">Language:</label>
                    <select id="language" required>
                        <option value="">Select Language</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
                <button type="submit" class="primary-btn">Save Contact</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
